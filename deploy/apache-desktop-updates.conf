# Include inside the HTTPS release vhost before its /booth/ and /studio/ aliases.
AliasMatch "^/(booth|studio)/updates/((?:win32|linux|darwin)-(?:x64|arm64)\.json)$" "/srv/tpv-desktop-updates/$1/$2"

<Directory "/srv/tpv-desktop-updates">
    Options None
    AllowOverride None
    Require all denied
    AddType application/json .json
    <FilesMatch "^(?:win32|linux|darwin)-(?:x64|arm64)\.json$">
        Require method GET HEAD
    </FilesMatch>
    Header always set Cache-Control "no-store"
    Header always set X-Content-Type-Options "nosniff"
</Directory>
