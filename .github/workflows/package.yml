name: Karaoke Core checks and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - run: npm ci --no-audit
      - run: npm test
      - run: npm pack --dry-run

  release:
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Check release tag
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci --no-audit
      - name: Create the private npm tarball release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir release-assets
          npm pack --pack-destination release-assets
          version="$(node -p "require('./package.json').version")"
          archive="thepropervolume-karaoke-core-$version.tgz"
          (cd release-assets && sha256sum "$archive" > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Karaoke Core $version" \
            --notes "Built from $GITHUB_SHA. Verify SHA256SUMS.txt before installing the npm tarball." \
            "release-assets/$archive" release-assets/SHA256SUMS.txt
